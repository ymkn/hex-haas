# Builds the Haas fork for Windows x64 and publishes it to GitHub Releases.
#
#   - A push of a `haas-v*` tag builds all three variants, packages them,
#     and creates one release with Hex-Haas-<version>-windows-x64.zip (GPU),
#     Hex-Haas-<version>-windows-x64-cpu.zip (no Vulkan loader needed),
#     Hex-Haas-<version>-windows-arm64-cpu.zip (native ARM64, CPU inference),
#     and a combined SHA256SUMS.
#   - A manual dispatch builds and uploads the same zips as workflow
#     artifacts, so a change can be verified before tagging.
#   - The daily workflow (daily-haas.yml) calls this workflow with
#     publish_daily to refresh the rolling `haas-daily` prerelease.
#   - Every published release also carries a manifest.json (per-variant
#     file name, SHA-256 and size, plus channel/version/build), which is
#     what `hex haas-upgrade` on an installed copy reads to update itself.
#
# The build is not code-signed: SmartScreen may warn, and the release notes
# point at SHA256SUMS for verification. Mirrors upstream's windows-x64 job
# (actions pinned to the same revisions it uses).
name: Haas release

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      channel:
        description: 'Channel recorded in haas-build.json (stable or daily)'
        type: string
        default: stable
      build_id:
        description: 'Build id recorded in haas-build.json (empty = timestamp)'
        type: string
        default: ''
      publish_daily:
        description: 'Publish the packages to the rolling haas-daily prerelease'
        type: boolean
        default: false
  push:
    tags:
      - 'haas-v*'

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      # In a subdirectory: the Vulkan SDK installs into the workspace, and a
      # release build needs a clean tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Cache the pinned Haas tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            source/tools/haas/speech.zip
            source/tools/haas/cmake.zip
            source/tools/haas/shaderc.zip
            source/tools/haas/vulkan-headers.zip
            source/tools/haas/spirv-headers.zip
          key: haas-tools-gpu-${{ hashFiles('source/scripts/setup-haas-build-tools.ps1', 'source/scripts/haas-common.ps1') }}
      - name: Install the Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Set up build tools
        working-directory: source
        shell: pwsh
        run: ./scripts/setup-haas-build-tools.ps1
      - name: Build
        working-directory: source
        shell: pwsh
        run: ./scripts/build-haas.ps1
      - name: Package
        working-directory: source
        shell: pwsh
        env:
          HAAS_CHANNEL: ${{ inputs.channel || 'stable' }}
          HAAS_BUILD: ${{ inputs.build_id }}
          HAAS_SOURCE: ${{ github.sha }}
        run: ./scripts/package-haas.ps1 -Destination ..\out
      - name: Upload the package as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Hex-Haas-windows-x64
          path: |
            out/*.zip
            out/SHA256SUMS
            out/RELEASE-NOTES.md
            out/haas-build.json
          if-no-files-found: error

  windows-x64-cpu:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: source
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Cache the pinned Haas tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            source/tools/haas-cpu/cmake.zip
            source/tools/haas-cpu/speech-source.zip
            source/tools/haas-cpu/ggml-source.zip
          key: haas-tools-cpu-x64-${{ hashFiles('source/scripts/setup-haas-cpu-build-tools.ps1', 'source/scripts/haas-common.ps1') }}
      - name: Set up CPU build tools
        run: ./scripts/setup-haas-cpu-build-tools.ps1
      - name: Build and check all three binaries for Vulkan imports
        run: ./scripts/build-haas-cpu.ps1
      - name: Smoke the CPU binaries
        run: ./scripts/smoke-haas-cpu.ps1 -Phase Binaries
      - name: Download Haas and run CPU inference on a synthetic WAV
        timeout-minutes: 20
        run: ./scripts/smoke-haas-cpu.ps1 -Phase Inference
      - name: Package
        env:
          HAAS_CHANNEL: ${{ inputs.channel || 'stable' }}
          HAAS_BUILD: ${{ inputs.build_id }}
          HAAS_SOURCE: ${{ github.sha }}
        run: ./scripts/package-haas-cpu.ps1 -Destination ..\out-cpu
      - name: Upload the CPU package as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Hex-Haas-windows-x64-cpu
          path: |
            out-cpu/*.zip
            out-cpu/SHA256SUMS
            out-cpu/RELEASE-NOTES.md
            out-cpu/haas-build.json
          if-no-files-found: error

  windows-arm64-cpu:
    # Native ARM64 build on an ARM64 runner; see release-haas-cpu.yml for the
    # same steps without release publication.
    runs-on: windows-11-arm
    timeout-minutes: 120
    defaults:
      run:
        working-directory: source
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Cache the pinned Haas tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            source/tools/haas-cpu-arm64/cmake.zip
            source/tools/haas-cpu-arm64/ninja.zip
            source/tools/haas-cpu-arm64/llvm.tar.xz
            source/tools/haas-cpu-arm64/speech-source.zip
            source/tools/haas-cpu-arm64/ggml-source.zip
          key: haas-tools-cpu-arm64-${{ hashFiles('source/scripts/setup-haas-cpu-build-tools.ps1', 'source/scripts/haas-common.ps1') }}
      - name: Set up CPU build tools
        run: ./scripts/setup-haas-cpu-build-tools.ps1 -Arch arm64
      - name: Build and check all three binaries for Vulkan imports
        run: ./scripts/build-haas-cpu.ps1 -Arch arm64
      - name: Smoke the ARM64 CPU binaries
        run: ./scripts/smoke-haas-cpu.ps1 -Arch arm64 -Phase Binaries
      - name: Download Haas and run ARM64 CPU inference on a synthetic WAV
        timeout-minutes: 40
        run: ./scripts/smoke-haas-cpu.ps1 -Arch arm64 -Phase Inference
      - name: Package
        env:
          HAAS_CHANNEL: ${{ inputs.channel || 'stable' }}
          HAAS_BUILD: ${{ inputs.build_id }}
          HAAS_SOURCE: ${{ github.sha }}
        run: ./scripts/package-haas-cpu.ps1 -Arch arm64 -Destination ..\out-cpu-arm64
      - name: Upload the ARM64 CPU package as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Hex-Haas-windows-arm64-cpu
          path: |
            out-cpu-arm64/*.zip
            out-cpu-arm64/SHA256SUMS
            out-cpu-arm64/RELEASE-NOTES.md
            out-cpu-arm64/haas-build.json
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/haas-v') || inputs.publish_daily
    needs: [windows-x64, windows-x64-cpu, windows-arm64-cpu]
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download the GPU package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Hex-Haas-windows-x64
          path: out
      - name: Download the CPU package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Hex-Haas-windows-x64-cpu
          path: out-cpu
      - name: Download the ARM64 CPU package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: Hex-Haas-windows-arm64-cpu
          path: out-cpu-arm64
      - name: Create the release with all three variants
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assetsDir = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Force $assetsDir | Out-Null
          $zips = @(Get-ChildItem out\Hex-Haas-*.zip, out-cpu\Hex-Haas-*.zip, out-cpu-arm64\Hex-Haas-*.zip)
          if ($zips.Count -ne 3) { throw "Expected exactly the GPU, x64 CPU, and ARM64 CPU zips, found $($zips.Count)." }
          foreach ($zip in $zips) { Copy-Item $zip.FullName $assetsDir }
          $sums = @(Get-Content out\SHA256SUMS) + @(Get-Content out-cpu\SHA256SUMS) + @(Get-Content out-cpu-arm64\SHA256SUMS)
          $sums | Set-Content (Join-Path $assetsDir 'SHA256SUMS') -Encoding ascii
          $notes = (Get-Content out\RELEASE-NOTES.md -Raw) + "`n" + (Get-Content out-cpu\RELEASE-NOTES.md -Raw) + "`n" + (Get-Content out-cpu-arm64\RELEASE-NOTES.md -Raw)
          $notes | Set-Content (Join-Path $assetsDir 'RELEASE-NOTES.md') -Encoding utf8NoBOM
          # Compose manifest.json from the per-variant haas-build.json
          # sidecars: `hex haas-upgrade` reads it to find its own variant's
          # asset and verify the download against the recorded SHA-256.
          $markers = [ordered]@{}
          foreach ($entry in @(@('gpu', 'out'), @('cpu', 'out-cpu'), @('arm64', 'out-cpu-arm64'))) {
              $markers[$entry[0]] = Get-Content (Join-Path $entry[1] 'haas-build.json') -Raw | ConvertFrom-Json
          }
          $base = $markers['gpu']
          foreach ($name in @('cpu', 'arm64')) {
              if ($markers[$name].version -ne $base.version -or $markers[$name].channel -ne $base.channel -or $markers[$name].build -ne $base.build) {
                  throw "haas-build.json mismatch between gpu and $name."
              }
          }
          $sumByFile = @{}
          foreach ($line in $sums) {
              if ($line -match '^([0-9a-f]{64})\s+(.+)$') { $sumByFile[$Matches[2].Trim()] = $Matches[1] }
          }
          $manifestAssets = [ordered]@{}
          foreach ($entry in @(@('gpu', 'out'), @('cpu', 'out-cpu'), @('arm64', 'out-cpu-arm64'))) {
              $zipFile = Get-ChildItem (Join-Path $entry[1] 'Hex-Haas-*.zip') | Select-Object -First 1
              if (!$sumByFile.ContainsKey($zipFile.Name)) { throw "SHA256SUMS has no entry for $($zipFile.Name)." }
              $manifestAssets[$entry[0]] = [ordered]@{ file = $zipFile.Name; sha256 = $sumByFile[$zipFile.Name]; size = $zipFile.Length }
          }
          $manifest = [ordered]@{
              product   = 'hex-haas'
              channel   = $base.channel
              version   = $base.version
              build     = $base.build
              source    = $base.source
              published = (Get-Date).ToUniversalTime().ToString('o')
              assets    = $manifestAssets
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $assetsDir 'manifest.json') -Encoding utf8NoBOM
          $assets = Get-ChildItem $assetsDir\Hex-Haas-*.zip, $assetsDir\SHA256SUMS, $assetsDir\manifest.json | ForEach-Object { $_.FullName }
          if ('${{ inputs.publish_daily }}' -eq 'true') {
              $null = gh release view haas-daily --json tagName 2>$null
              if ($LASTEXITCODE -eq 0) {
                  gh release delete haas-daily --yes --cleanup-tag
                  if ($LASTEXITCODE) { throw 'Failed to delete the previous haas-daily release.' }
              }
              $dailyNotes = "Daily build $($base.build) of Hex Haas $($base.version), from source $($base.source).`n`n" + $notes
              $dailyNotes | Set-Content (Join-Path $assetsDir 'RELEASE-NOTES.md') -Encoding utf8NoBOM
              gh release create haas-daily --prerelease --target "${{ github.sha }}" --title "Haas daily build $($base.build)" --notes-file (Join-Path $assetsDir 'RELEASE-NOTES.md') @assets
          } else {
              gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file (Join-Path $assetsDir 'RELEASE-NOTES.md') @assets
          }
